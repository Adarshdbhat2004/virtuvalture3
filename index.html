<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Luxury Resort — Virtual Tour</title>

<!-- Pannellum (360 engine) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="panorama"></div>

  <div id="tour-loader">
    <div class="loader-mark"></div>
    <p>Loading 360° view…</p>
  </div>

  <!-- Top-left place card -->
  <header id="place-card">
    <div id="place-card-main">
      <p id="property-name">Luxury Resort</p>
      <a id="maps-link" href="#" target="_blank" rel="noopener">View on Google Maps</a>
    </div>
    <button id="pin-btn" aria-label="View location">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
    </button>
  </header>

  <!-- Small utility row under the place card -->
  <div id="util-row">
    <button class="icon-btn" id="gyro-btn" aria-label="Toggle motion view" title="Motion view">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 3l3 3-3 3"/></svg>
    </button>
    <button class="icon-btn" id="map-btn" aria-label="Toggle floor map" title="Floor map">
      <svg viewBox="0 0 24 24"><path d="M9 4l6 2 5-2v14l-5 2-6-2-5 2V6z"/><path d="M9 4v14M15 6v14"/></svg>
    </button>
    <button class="icon-btn" id="fullscreen-btn" aria-label="Toggle fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <!-- Right-edge vertical scene list -->
  <nav id="scene-list" aria-label="Rooms"></nav>

  <!-- Floor-plan mini-map (bonus feature, toggled from util row) -->
  <div id="map-panel">
    <p id="map-title">Property Map</p>
    <svg id="map-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <!-- Bottom-right compass + zoom stack -->
  <button id="compass" aria-label="Reset view direction" title="Click to face forward">
    <svg viewBox="0 0 44 44">
      <circle class="compass-ring" cx="22" cy="22" r="19"/>
      <path id="compass-needle" class="compass-needle" d="M22 6 L26 22 L22 20 L18 22 Z"/>
    </svg>
  </button>
  <div id="zoom-stack">
    <button class="icon-btn" id="zoom-in-btn" aria-label="Zoom in" title="Zoom in">
      <svg viewBox="0 0 24 24"><path d="M11 4v14M4 11h14"/></svg>
    </button>
    <button class="icon-btn" id="zoom-out-btn" aria-label="Zoom out" title="Zoom out">
      <svg viewBox="0 0 24 24"><path d="M4 11h14"/></svg>
    </button>
  </div>

  <!-- Bottom-left contact bubble -->
  <a id="contact-bubble" href="tel:" aria-label="Contact us">
    <span id="contact-icon">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.9 8.49 8.6 8.6 0 0 1-3.24-.64L3 21l1.65-5.86A8.5 8.5 0 1 1 21 11.5z"/></svg>
    </span>
    <span id="contact-label">Contact us</span>
  </a>

  <div id="drag-hint"><span>Drag to look around</span></div>

  <!-- Bottom credit bar -->
  <footer id="credit-bar">
    <span class="credit-link">Keyboard shortcuts</span>
    <span id="credit-brand">Luxury Resort</span>
    <span class="credit-link">Terms</span>
    <span class="credit-link">Report a problem</span>
  </footer>

  <script src="tour.js"></script>
</body>
</html>
